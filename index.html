<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Date? ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #b71c1c, #1a237e);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            padding: 40px 25px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .spiderman {
            font-size: 80px;
            margin-bottom: 15px;
        }

        h1 {
            color: #d32f2f;
            font-size: 30px;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 80px;
        }

        button {
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background: #d32f2f;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.08);
        }

        #noBtn {
            background: #e0e0e0;
            color: #333;
        }

        #noBtn:hover {
            background: #bdbdbd;
        }

        #success {
            display: none;
        }

        #success h1 {
            color: #d32f2f;
        }

        .heart {
            font-size: 70px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="container" id="question">

        <div class="spiderman">🕷️</div>

        <h1>Movie Date? ❤️</h1>

        <p>
            Nood tayo cine?
            <strong>Spider-Man</strong> 🕷️🕸️
            <br><br>
            Sasama ka o sasama ka 🍿🥤
        </p>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">YES ❤️</button>
            <button id="noBtn" onclick="sayNo()">NO 😭</button>
        </div>

    </div>


    <div class="container" id="success">

        <div class="heart">❤️🕷️</div>

        <h1>YAAAY! 🥹❤️</h1>

        <p>
            I knew you'd say yes! 😌
            <br><br>
            Yaaaaan ganyan dapaat HAHAHAHA
            <br>
            <strong>It's a date! 🕷️❤️</strong>
        </p>

    </div>


    <script>

        let yesSize = 1;

        function sayNo() {

            yesSize += 0.35;

            document.getElementById("yesBtn").style.transform =
                `scale(${yesSize})`;

            // Habang lumalaki ang YES,
            // unti-unting lumiliit ang NO
            let noSize = Math.max(0.4, 1 - (yesSize - 1) * 0.25);

            document.getElementById("noBtn").style.transform =
                `scale(${noSize})`;
        }

        function sayYes() {

            document.getElementById("question").style.display = "none";

            document.getElementById("success").style.display = "block";

        }

    </script>

</body>
</html>
